reconnect_grace_seconds = 60.0
content_root = "../../AxmolFighter-Client/Content"  # 需含 config + .ani/.box/motion（可不含 PNG）

[gateway]
host = "127.0.0.1"
port = 17100
reconnect_interval = 3.0
