[server]
instance_id = 1

[gateway]
addr = "127.0.0.1:17100"
reconnect_interval = 3

# 城镇同步：移动校验 / 广播 / AOI
[sync]
# 允许的最大移动速度（像素/秒）。
max_speed = 600.0
# 位移校验容差（相对 max_speed 的倍数）。
tolerance = 1.5
# 位移预算（token bucket）的突发时长（秒）：预算上限 = max_speed × tolerance × burst_seconds。
burst_seconds = 0.5
# 广播 tick 间隔（毫秒），默认 10 Hz。
tick_ms = 100
# AOI 半径（像素）。0 表示关闭 AOI，整个场景可见。
aoi_radius = 0.0
