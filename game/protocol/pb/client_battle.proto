syntax = "proto3";

// 客户端和战斗服业务通信协议。
package PB.Battle;

import "game_types.proto";

option optimize_for = LITE_RUNTIME;

// ============================================================================
// 客户端和战斗服协议范围：20000-29999
// ============================================================================

// [战斗同步] 20010-20017
// 客户端与 battle 服之间基于「服务器权威 lockstep + 客户端回滚」的帧同步。
// battle 服确认每帧输入并广播；客户端本地预测并在确认不一致时回滚重推。

// 客户端通知 battle 服：已进入战斗界面，准备好接收战斗开始参数。
message BattleReadyReq {
    enum MsgId { None = 0; Id = 20010; }

    // 战斗 id。
    uint32 battle_id = 1;
}

// battle 服下发战斗开始参数（mugen 序列化的 WorldSetup + 帧参数 + 玩家列表）。
// 断线重连时同样先发本消息（同一份 setup），紧接着发 BattleSnapshotPush 把世界复位到当前帧。
message BattleStartPush {
    enum MsgId { None = 0; Id = 20011; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 本客户端所在槽位。
    uint32 local_slot = 2;
    // 槽位总数。
    uint32 slot_count = 3;
    // mugen 序列化的 WorldSetup。
    bytes setup = 4;
    // 服务器帧 0 对应的墙钟时间戳（毫秒）。
    uint64 start_server_time_ms = 5;
    // 每逻辑帧毫秒数。
    uint32 frame_ms = 6;
    // 客户端提交输入需预留的帧延迟。
    uint32 input_delay_frames = 7;
    // 参战玩家列表。
    repeated BattlePlayerInfo players = 8;
    // true 表示战斗已在进行（断线重连 / 迟到入座）：紧随其后会有一条 BattleSnapshotPush，
    // 客户端必须等快照复位后才开始推进，不得从帧 0 重新模拟。
    bool resume = 9;
}

// 单个参战玩家公开信息。
message BattlePlayerInfo {
    // 战斗槽位。
    uint32 slot = 1;
    // 玩家 id。
    int64 player_id = 2;
    // 角色名。
    string name = 3;
    // 职业 id。
    int32 class_id = 4;
    // 阵营。
    int32 camp = 5;
    // 外观（仅表现层使用，不进入模拟的 WorldSetup；由 game 服在创建战斗时下发）。
    PB.Types.TownAppearance appearance = 6;
}

// 客户端向 battle 服推送本地输入帧。
message BattleInputPush {
    enum MsgId { None = 0; Id = 20012; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 客户端已确认的服务器帧号。
    uint32 ack_frame = 2;
    // 本地预测输入帧。
    repeated BattleInputFrame inputs = 3;
    // 客户端计算的帧哈希（用于对账）。
    repeated BattleFrameHash client_hashes = 4;
    // 客户端发送本消息时的本地单调时钟（毫秒）；服务器在下一条 BattleFramesPush 里原样回显，
    // 客户端据此测量 RTT。
    uint64 client_time_ms = 5;
}

// 单帧输入（mugen 序列化的 PlayerInput）。
message BattleInputFrame {
    // 帧号。
    uint32 frame = 1;
    // mugen 序列化的 PlayerInput。
    bytes input = 2;
}

// battle 服广播确认的帧输入。
message BattleFramesPush {
    enum MsgId { None = 0; Id = 20013; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 服务器当前帧号。
    uint32 server_frame = 2;
    // 服务器当前帧的墙钟时间戳（毫秒）。
    uint64 server_time_ms = 3;
    // 已确认帧输入。
    repeated BattleConfirmedFrame frames = 4;
    // 服务器帧哈希。
    repeated BattleFrameHash hashes = 5;
    // 以下字段按接收方槽位个性化，用于客户端自适应输入领先量。
    // 回显该槽位最近一条 BattleInputPush.client_time_ms（仅回显一次；0 表示自上次推送以来没有新输入）。
    // 服务器持有时间（至多一个服务器 tick）不扣除，RTT 因此略偏大。
    uint64 echo_client_time_ms = 6;
    // 自上次推送以来该槽位首次到达的输入帧里，最小的「到达富余帧数」：
    // 输入帧号 - (到达时已 tick 帧号 + 1)；0 表示刚好赶上，负数表示迟到。
    sint32 input_slack_min = 7;
    // input_slack_min 对应的输入帧号。
    uint32 input_slack_frame = 8;
    // 本次统计覆盖的首次到达输入帧数；0 表示没有样本，input_slack_* 无效。
    uint32 input_slack_samples = 9;
    // 该槽位自战斗开始累计的迟到输入帧数（首次到达时已被 tick；
    // 其中非空且迟到不超过上限的命令会顺延到下一帧执行，其余被丢弃）。
    uint32 late_inputs = 10;
}

// 单个已确认帧（mugen 序列化的 FrameInput）。
message BattleConfirmedFrame {
    // 帧号。
    uint32 frame = 1;
    // mugen 序列化的 FrameInput。
    bytes input = 2;
}

// 帧哈希。
message BattleFrameHash {
    // 帧号。
    uint32 frame = 1;
    // 哈希值。
    uint64 hash = 2;
}

// 客户端请求服务器按帧号下发快照重同步。
message BattleResyncReq {
    enum MsgId { None = 0; Id = 20014; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 请求重同步的帧号。
    uint32 frame = 2;
}

// battle 服下发世界快照用于重同步。
message BattleSnapshotPush {
    enum MsgId { None = 0; Id = 20015; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 快照帧号。
    uint32 frame = 2;
    // mugen 序列化的世界快照。
    bytes world = 3;
    // 快照之后的已确认帧输入。
    repeated BattleConfirmedFrame frames_after = 4;
    // 快照生成时服务器墙钟时间戳（毫秒），客户端据此重置时钟偏移
    // （重连时帧号远大于 0，不能沿用 BattleStartPush 的帧 0 时钟再慢慢收敛）。
    uint64 server_time_ms = 5;
}

// battle 服下发战斗结束结果。
message BattleEndPush {
    enum MsgId { None = 0; Id = 20016; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 胜者阵营；0 表示平局。
    int32 winner_camp = 2;
    // 结束原因：0=Ko（阵营被清空）、1=Timeout（限时）、2=Surrender（投降）、
    // 3=Disconnect（断线判负）、4=Abort（无人就绪中止）。前两项与
    // mugen::sim_legacy::PvpRoundEndReason 数值对齐。
    int32 reason = 3;
    // 结束帧号。
    uint32 end_frame = 4;
    // 各玩家结果。
    repeated PB.Types.BattlePlayerResult players = 5;
}

// 客户端请求离开战斗（投降/退出；由 battle 服决定结果）。
message BattleLeaveReq {
    enum MsgId { None = 0; Id = 20017; }

    // 战斗 id。
    uint32 battle_id = 1;
}