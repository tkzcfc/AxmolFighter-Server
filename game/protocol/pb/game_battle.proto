syntax = "proto3";

// game 服和 battle 服之间的内部通信协议。
package PB.BattleInternal;

import "game_types.proto";

option optimize_for = LITE_RUNTIME;

// ============================================================================
// game 和 battle 服协议范围：60000-60999
// ============================================================================

// [创建战斗] 60000-60001

// Game 发给 Battle，请求创建一场战斗。
message BattleCreateReq {
    enum MsgId { None = 0; Id = 60000; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 房间 id。
    int32 room_id = 2;
    // 战斗世界随机种子（由 game 生成，battle/客户端共用）。
    uint64 random_seed = 3;
    // 是否为 PVP 竞技战斗。
    bool pvp = 4;
    // 参战玩家。
    repeated PB.Types.BattlePlayerSpec players = 5;
}

// Battle 返回创建战斗结果。
message BattleCreateResp {
    enum MsgId { None = 0; Id = 60001; }

    // 创建结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 战斗 id。
    uint32 battle_id = 3;
    // 承载这场战斗的 battle 实例 id。
    uint32 battle_instance_id = 4;
}

// [战斗结果] 60002

// Battle 单向通知 Game：一场战斗结束（结果上报）。game 据此清理战斗绑定，
// 让双方玩家可以返回城镇（客户端随后发 EnterSceneReq）。
message BattleResultReq {
    enum MsgId { None = 0; Id = 60002; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 胜者阵营；0 表示平局。
    int32 winner_camp = 2;
    // 结束原因：0=Ko（阵营被清空）、1=Timeout（限时）、2=Surrender（投降）、
    // 3=Disconnect（断线判负）、4=Abort（无人就绪中止）。前两项与
    // mugen::sim_legacy::PvpRoundEndReason 数值对齐。
    int32 reason = 3;
    // 结束帧号。
    uint32 end_frame = 4;
    // 各玩家结果。
    repeated PB.Types.BattlePlayerResult players = 5;
}
// [断线重连] 60003-60004

// Game 发给 Battle：某玩家用新 session 重新接入进行中的战斗（按 player_id 找槽位）。
// Battle 把新 session 绑定到该槽位并清除断线计时；随后客户端发 BattleReadyReq，
// battle 在 Running 状态下据此补发 BattleStartPush + BattleSnapshotPush。
message BattleRejoinReq {
    enum MsgId { None = 0; Id = 60003; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 玩家 id。
    int64 player_id = 2;
    // 新的客户端 session id。
    uint32 session_id = 3;
}

// Battle 返回重连结果。
message BattleRejoinResp {
    enum MsgId { None = 0; Id = 60004; }

    // 0 成功；1 战斗不存在；2 战斗已结束；3 玩家不在该战斗中。
    int32 code = 1;
    // 结果说明。
    string message = 2;
}