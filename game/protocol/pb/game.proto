syntax = "proto3";

// 游戏业务通信协议。
package PB.Game;

import "game_types.proto";

option optimize_for = LITE_RUNTIME;

// ============================================================================
// 客户端和游戏服协议范围：1-19999
// ============================================================================

// [通用响应] 900-999
// 客户端和 game/battle/town 服之间通用的成功/错误响应。

// 通用成功响应。
message CommonSuccessResp {
    enum MsgId { None = 0; Id = 900; }

    // 结果码，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
}

// 通用错误响应。
message CommonErrorResp {
    enum MsgId { None = 0; Id = 901; }

    // 错误码。
    int32 code = 1;
    // 错误说明。
    string message = 2;
}

// [账号登录] 1000-1099
// 登录、注册、账号信息下发。

// 登录请求。
message LoginReq {
    enum MsgId { None = 0; Id = 1000; }

    // 账号名。
    string account = 1;
    // 密码。
    string password = 2;
}

// 登录响应。
message LoginResp {
    enum MsgId { None = 0; Id = 1001; }

    // 登录结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 玩家 id。
    int64 player_id = 3;
    // 玩家昵称。
    string nickname = 4;
    // 登录后下发的服务器配置。
    ServerConfig server_config = 5;
    // 登录账号信息。
    AccountInfo account_info = 6;
}

// 注册请求。
message RegisterReq {
    enum MsgId { None = 0; Id = 1002; }

    // 账号名。
    string account = 1;
    // 密码。
    string password = 2;
    // 昵称。
    string nickname = 3;
}

// 注册响应。
message RegisterResp {
    enum MsgId { None = 0; Id = 1003; }

    // 注册结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 新建玩家 id。
    int64 player_id = 3;
}

// [角色管理] 1100-1299
// 玩家基础信息、创建角色、拉取角色列表、选择角色。

// 玩家基础信息。
message PlayerInfo {
    enum MsgId { None = 0; Id = 1100; }

    // 玩家 id。
    int64 player_id = 1;
    // 昵称。
    string nickname = 2;
    // 等级。
    int32 level = 3;
    // 经验。
    int64 exp = 4;
}

// 创建角色请求。
message CreateCharacterReq {
    enum MsgId { None = 0; Id = 1200; }

    // 角色名。
    string name = 1;
    // 职业 id。
    int32 class_id = 2;
    // 性别。
    int32 gender = 3;
}

// 创建角色响应。
message CreateCharacterResp {
    enum MsgId { None = 0; Id = 1201; }

    // 创建结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 创建成功后的角色信息。
    CharacterInfo character = 3;
}

// 拉取角色列表请求。
message FetchCharacterListReq {
    enum MsgId { None = 0; Id = 1202; }
}

// 拉取角色列表响应。
message FetchCharacterListResp {
    enum MsgId { None = 0; Id = 1203; }

    // 拉取结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 角色列表。
    repeated CharacterInfo characters = 3;
}

// 选择角色请求。
message SelectCharacterReq {
    enum MsgId { None = 0; Id = 1204; }

    // 要进入游戏的角色 id。
    int64 character_id = 1;
}

// 选择角色响应。
message SelectCharacterResp {
    enum MsgId { None = 0; Id = 1205; }

    // 选择结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 当前角色信息。
    CharacterInfo character = 3;
    // 当前角色背包。
    InventoryInfo inventory = 4;
}

// [场景入口] 1300-1399
// 客户端只表达要进入的目标，game 服负责后续服务编排与绑定。

// 客户端请求进入战斗。
message BattleJoinReq {
    enum MsgId { None = 0; Id = 1300; }

    // 玩家 id。服务端实际以登录态为准。
    int64 player_id = 1;
    // 地图 id。
    int32 map_id = 2;
}

// 进入战斗响应。
message BattleJoinResp {
    enum MsgId { None = 0; Id = 1301; }

    // 进入结果，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 战斗 id。
    uint32 battle_id = 3;
    // 当前服务器帧。
    uint32 server_frame = 4;
    // 战斗世界快照。
    bytes world_dump = 5;
}

// [城镇入口] 1302-1303
// 客户端只表达要去哪里，game 服用登录态确认玩家并请求 town 服。

// 客户端请求进入城镇场景。
message EnterSceneReq {
    enum MsgId { None = 0; Id = 1302; }

    // 要进入的目标类型。
    SceneEnterType type = 1;
    // 普通地图 id，type 为 Map 时填写。
    uint32 map_id = 2;
    // 家园拥有者玩家 id，type 为 Home 时填写。
    uint64 owner_uid = 3;
    // 客户端当前上报的玩家状态，player_id 由服务器登录态覆盖。
    PlayerState state = 4;
}

// game 服返回给客户端的进入城镇场景结果。
message EnterSceneResp {
    enum MsgId { None = 0; Id = 1303; }

    // 结果码，0 表示成功。
    int32 code = 1;
    // 结果说明。
    string message = 2;
    // 当前场景公开信息，不包含 SceneId。
    SceneInfo scene = 3;
    // 当前场景内的玩家状态快照，包含自己。
    repeated PlayerState players = 4;
}

// [游戏服通知] 1400-1499
// game 服主动推送账号踢下线和后端服务下线通知。

// 账号在别处登录，服务器主动通知当前客户端下线。
message AccountKickedPush {
    enum MsgId { None = 0; Id = 1400; }

    // 原因码，1 表示账号在别处登录。
    int32 reason = 1;
    // 下线说明。
    string message = 2;
}

// 玩家所在战斗服下线时由 game 服推给客户端。
message BattleServerOfflinePush {
    enum MsgId { None = 0; Id = 1401; }

    // 受影响的战斗 id。
    uint32 battle_id = 1;
    // 下线的 battle 实例 id。
    uint32 battle_instance_id = 2;
    // 原因码，1 表示后端服务下线。
    int32 reason = 3;
    // 下线说明。
    string message = 4;
}

// 玩家所在城镇服下线时由 game 服推给客户端。
message TownServerOfflinePush {
    enum MsgId { None = 0; Id = 1402; }

    // 下线的 town 实例 id。
    uint32 town_instance_id = 1;
    // 原因码，1 表示后端服务下线。
    int32 reason = 2;
    // 下线说明。
    string message = 3;
}

// ============================================================================
// 客户端和战斗服协议范围：20000-29999
// ============================================================================

// [战斗同步] 20012-20013
// 客户端向 battle 服推送输入，battle 服向客户端下发战斗快照。

// 客户端战斗输入。
message BattleInputPush {
    enum MsgId { None = 0; Id = 20012; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 客户端帧号。
    uint32 client_frame = 2;
    // 输入按键位。
    uint32 input_mask = 3;
    // 客户端时间戳，毫秒。
    uint64 client_time_ms = 4;
}

// 战斗服下发的战斗快照。
message BattleSnapshotPush {
    enum MsgId { None = 0; Id = 20013; }

    // 战斗 id。
    uint32 battle_id = 1;
    // 服务器帧号。
    uint32 server_frame = 2;
    // 服务器时间戳，毫秒。
    uint64 server_time_ms = 3;
    // 战斗世界快照。
    bytes world_dump = 4;
}

// ============================================================================
// 客户端和城镇服协议范围：30000-39999
// ============================================================================

// [城镇同步] 30000-30003
// 客户端向已绑定 town 服推送自身状态，town 服向同场景客户端广播玩家变化。

// 客户端向已绑定 town 服推送自身状态。
message TownPlayerStatePush {
    enum MsgId { None = 0; Id = 30000; }

    // 客户端当前上报的玩家状态，player_id 由 town 服记录覆盖。
    PlayerState state = 1;
}

// town 服通知客户端：同场景有玩家进入。
message ScenePlayerEnterPush {
    enum MsgId { None = 0; Id = 30001; }

    // 新进入玩家的状态。
    PlayerState state = 1;
}

// town 服通知客户端：同场景有玩家离开。
message ScenePlayerLeavePush {
    enum MsgId { None = 0; Id = 30002; }

    // 离开场景的玩家 id。
    int64 player_id = 1;
}

// town 服通知客户端：同场景玩家状态更新。
message ScenePlayerStatePush {
    enum MsgId { None = 0; Id = 30003; }

    // 更新后的玩家状态。
    PlayerState state = 1;
}